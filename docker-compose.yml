# Shelfwarden — opinionated multi-container setup.
# Run from repo root: docker compose up -d
# App: http://localhost:8080
#
# Environment variables use the .NET configuration convention: each JSON level in appsettings
# is separated by a double underscore (e.g. Database:Provider -> Database__Provider).
# Values below match Shelfwarden/appsettings.json unless noted (container paths under /app/data/...).
#
# A `.env` file at the repo root can override any ${VAR} placeholders — see .env.example.
#
# Defaults below run the web app against PostgreSQL with built-in ASP.NET Identity. To switch the
# database to SQLite (single-file in the image), set Database__Provider=Sqlite and point
# ConnectionStrings__DefaultConnection at a file under a mounted volume (e.g. /app/data/db/app.db),
# and remove the db service if you do not need Postgres. To use Keycloak, set
# Authentication__Provider=Keycloak, fill in Authentication__Keycloak__*, and optionally uncomment
# the keycloak service at the bottom of this file.

services:
  app:
    build:
      context: .
      dockerfile: Shelfwarden/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # ---- Active settings (this stack) ----
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Npgsql
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=shelfwarden;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      # Omit ConnectionStrings__Hangfire for Npgsql/SqlServer — Hangfire shares DefaultConnection (hangfire schema).
      # Only SQLite uses a separate file via Hangfire__SqlitePath.
      Authentication__Provider: Identity
      # Seeded on first start (see Seed:Admin in appsettings.json). Use Seed__Admin__* — not SeedAdmin__*.
      Seed__Admin__Email: "admin@shelfwarden.local"
      Seed__Admin__Password: "${ADMIN_PASSWORD:-Admin123!}"
      Storage__CoversPath: /app/data/covers

      # ---- All configuration keys (defaults per appsettings.json or app code; uncomment to override) ----
      # Host / ASP.NET Core
      # ASPNETCORE_ENVIRONMENT: Production
      # ASPNETCORE_URLS: http://+:8080
      # AllowedHosts: "*"
      # DetailedErrors: "false"
      # (set to "true" for developer exception pages — appsettings.Development.json)

      # Microsoft.Extensions.Logging (mirrors "Logging" in appsettings.json)
      # Logging__LogLevel__Default: Information
      # Logging__LogLevel__Microsoft.AspNetCore: Warning
      # Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning

      # Serilog (optional; Host.UseSerilog reads from configuration — add if you define sinks/levels in JSON)
      # Serilog__MinimumLevel__Default: Information
      # Serilog__MinimumLevel__Override__Microsoft: Warning

      # Database (valid: Sqlite, SqlServer, Npgsql, MySql)
      # Database__Provider: Sqlite

      # Connection strings (defaults in appsettings.json: Sqlite file + empty Hangfire)
      # ConnectionStrings__DefaultConnection: "Data Source=shelfwarden.db"
      # Optional; omit for Npgsql/SqlServer so Hangfire uses DefaultConnection:
      # ConnectionStrings__Hangfire: ""

      # Hangfire — Sqlite file when Database__Provider is Sqlite; Npgsql/SqlServer share DefaultConnection.
      # Hangfire__SqlitePath: hangfire.db

      # Authentication (valid: Identity, Keycloak, None)
      # Authentication__Provider: Identity
      # Authentication__Keycloak__Authority: ""
      # Authentication__Keycloak__ClientId: ""
      # Authentication__Keycloak__ClientSecret: ""
      # Authentication__Keycloak__AdminClientId: ""
      # Authentication__Keycloak__AdminClientSecret: ""
      # Authentication__Keycloak__PublicOrigin: ""
      # Authentication__Keycloak__BackchannelBaseUrl: ""

      # First-run admin seed (also: Seed__Admin__UserName — defaults to email if unset)
      # Seed__Admin__Email: "admin@shelfwarden.local"
      # Seed__Admin__UserName: ""
      # Seed__Admin__Password: "Admin123!"

      # Storage paths (relative paths resolve under the app base directory; container layout uses /app/data/...)
      # Storage__CoversPath: covers
      # Storage__AuthorPhotosPath: ""
      # Storage__AudiobooksPath: ""
      # Storage__TtsCachePath: ""

    volumes:
      # Mount your ebook libraries here. Anything inside /app/data/library is what Shelfwarden scans.
      - D:\_Apps\Shelfwarden\Library:/app/data/library
      - D:\_Apps\Shelfwarden\Covers:/app/data/covers
      - D:\_Apps\Shelfwarden\Logs:/app/data/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: shelfwarden
    volumes:
      - shelfwarden-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Keycloak (optional) ──────────────────────────────────────────────────────
  # Uncomment to run Keycloak alongside the app. Set Authentication__Provider=Keycloak on `app`
  # and fill in Authentication__Keycloak__* environment variables.
  #
  # keycloak:
  #   image: quay.io/keycloak/keycloak:26.5.5
  #   container_name: keycloak
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     KC_BOOTSTRAP_ADMIN_USERNAME: admin
  #     KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
  #     KC_DB: postgres
  #     KC_DB_URL: jdbc:postgresql://db:5432/keycloak
  #     KC_DB_USERNAME: postgres
  #     KC_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  #   command: start-dev
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

volumes:
  shelfwarden-pgdata: